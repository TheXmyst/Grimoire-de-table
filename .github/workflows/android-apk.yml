name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit

      # Mises à jour automatiques : seulement si le secret EXPO_TOKEN existe
      - name: Lier le projet Expo
        if: env.EXPO_TOKEN != ''
        run: npx eas-cli@latest init --non-interactive --force
      - name: Configurer les mises à jour automatiques
        run: node scripts/configure-updates.js
      - name: Publier la mise à jour dans les applis installées
        if: env.EXPO_TOKEN != ''
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Mise à jour manuelle' }}
        run: npx eas-cli@latest update --channel production --platform android --non-interactive --message "$MESSAGE"

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install
      # Gradle manque de Metaspace avec le module de mises à jour : on lui donne plus de mémoire
      - name: Donner plus de mémoire à Gradle
        run: |
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> android/gradle.properties
      - name: Tracer les appels à node pendant la compilation
        run: |
          mkdir -p "$RUNNER_TEMP/nodewrap"
          REAL_NODE="$(command -v node)"
          cat > "$RUNNER_TEMP/nodewrap/node" <<WRAP
          #!/usr/bin/env bash
          err=\$(mktemp)
          "$REAL_NODE" "\$@" 2> >(tee "\$err" >&2)
          code=\$?
          if [ \$code -ne 0 ]; then
            { echo "=== node \$* (dans \$PWD) -> code \$code"; cat "\$err"; } >> "$RUNNER_TEMP/node-failures.log"
          fi
          exit \$code
          WRAP
          chmod +x "$RUNNER_TEMP/nodewrap/node"
          echo "$RUNNER_TEMP/nodewrap" >> "$GITHUB_PATH"
      - name: Compiler l'APK
        working-directory: android
        timeout-minutes: 45
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Afficher les erreurs de node
        if: failure()
        run: cat "$RUNNER_TEMP/node-failures.log" || echo "Aucun appel à node n'a échoué."
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-de-table-apk
          path: android/app/build/outputs/apk/release/*.apk
